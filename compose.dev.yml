# Entorno local de desarrollo: 1 broker Kafka (KRaft), 1 PostgreSQL y todos los servicios.
#   docker compose -f compose.dev.yml up -d --build
# Gateway en http://localhost:18080. Datos de demo activados. NO usar en producción (ver ansible/).
name: pedidos-kafka-dev

x-pg-pass: &pg-pass
  PG_PASS_PEDIDOS: dev
  PG_PASS_SAGA: dev
  PG_PASS_INVENTARIO: dev
  PG_PASS_PAGOS: dev
  PG_PASS_ENVIOS: dev
  PG_PASS_NOTIFICACIONES: dev

x-app-env: &app-env
  KAFKA_BROKERS: kafka-1:9092
  KAFKA_RF: "1"
  KAFKA_MIN_ISR: "1"
  KAFKA_PARTITIONS: "6"
  SEED_DEMO_DATA: "true"
  SAGA_STEP_TIMEOUT_MS: "8000"

x-app: &app
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    kafka-1: { condition: service_healthy }
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null || exit 1"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 20s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: dev
      <<: *pg-pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  kafka-1:
    image: apache/kafka:4.0.0
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafka1:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 20
      start_period: 20s

  pedidos:
    <<: *app
    build: { context: ., args: { SERVICE: pedidos } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://pedidos_app:dev@postgres:5432/pedidos_db

  orquestador:
    <<: *app
    build: { context: ., args: { SERVICE: orquestador } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://saga_app:dev@postgres:5432/saga_db

  inventario:
    <<: *app
    build: { context: ., args: { SERVICE: inventario } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://inventario_app:dev@postgres:5432/inventario_db

  pagos:
    <<: *app
    build: { context: ., args: { SERVICE: pagos } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://pagos_app:dev@postgres:5432/pagos_db

  envios:
    <<: *app
    build: { context: ., args: { SERVICE: envios } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://envios_app:dev@postgres:5432/envios_db

  notificaciones:
    <<: *app
    build: { context: ., args: { SERVICE: notificaciones } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://notificaciones_app:dev@postgres:5432/notificaciones_db

  gateway:
    restart: unless-stopped
    build: { context: ., args: { SERVICE: gateway } }
    environment:
      JWT_SECRET: dev-secret-no-usar-en-produccion
      DEV_LOGIN: "true"   # login de demostración para la web
    ports:
      - "127.0.0.1:18080:3000"
    depends_on:
      pedidos: { condition: service_healthy }
      orquestador: { condition: service_healthy }

volumes:
  pgdata:
  kafka1:
